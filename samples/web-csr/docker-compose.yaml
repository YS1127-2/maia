services:
  # バックエンド (Spring Boot)
  backend:
    platform: linux/amd64
    build:
      context: ./dressca-backend
      dockerfile: Dockerfile
    container_name: dressca-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
    networks:
      - dressca-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health/check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # フロントエンド (Vue.js)
  frontend:
    platform: linux/amd64
    build:
      context: ./dressca-frontend
      dockerfile: Dockerfile
    container_name: dressca-frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    command: sh -c "cd consumer && npm run mock -- --host 0.0.0.0"
    volumes:
      # ソースコードの変更を反映するためにマウント
      - ./dressca-frontend:/app
      - /app/node_modules
      - /app/consumer/node_modules
      - /app/admin/node_modules
    networks:
      - dressca-network
    depends_on:
      backend:
        condition: service_healthy

  # フロントエンド (React)
  frontend-react:
    platform: linux/amd64
    build:
      context: ./dressca-frontend-react
      dockerfile: Dockerfile
    container_name: dressca-frontend-react
    ports:
      - "5174:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8080
    volumes:
      # ソースコードの変更を反映するためにマウント
      - ./dressca-frontend-react:/app
      - /app/node_modules
    networks:
      - dressca-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  dressca-network:
    driver: bridge
